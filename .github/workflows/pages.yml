name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Derived pages are build artifacts: generated here from the committed
      # markdown, never committed, so the deployed site cannot go stale.
      - name: Build announcements pages
        run: python3 scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages intermittently reports "Found 0 artifact(s)" right after a
      # successful upload; one guarded retry absorbs it.
      - uses: actions/deploy-pages@v4
        id: deployment_attempt
        continue-on-error: true
      - name: Settle artifact visibility
        run: sleep 10
      - uses: actions/deploy-pages@v4
        id: deployment
