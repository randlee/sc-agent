name: CI

on:
  pull_request:
    # `branches` filters on the PR *base*. Any branch a stacked layer can sit
    # on must be listed, or that layer's PR gets no CI at all. `*` does not
    # match `/`, which the lower-case naming rule already forbids in slugs.
    branches:
      - develop
      - main
      - "integrate/*"
      - "integration/*"
      - "sprint/*"
      - "fix/*"
      - "hotfix/*"
      - "feature/*"
      - "plan/*"
      - "docs/*"
      - "chore/*"
      - "ci/*"
      - "release/*"
      - "merge/*"
      - "evidence/*"
      - "triage/*"
  push:
    branches: [develop, main]

# One live run per ref: a new push to a PR branch cancels the queued/running
# run for the superseded commit instead of stacking a full matrix behind it.
# Pushes to develop/main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: Detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Look for the Cargo workspace
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; echo "No Cargo.toml yet: Rust jobs are skipped."; fi

  fmt:
    name: Format check
    needs: [detect]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo --locked fmt --check --all

  clippy:
    name: Clippy
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace lints
        run: cargo clippy --locked --workspace --all-features -- -D warnings


  test:
    name: Test (${{ matrix.os }})
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

  # The parser is shipped in the single sc-agent wheel.
  treesitter:
    name: sc-treesitter features and wheel
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-treesitter-${{ hashFiles('**/Cargo.lock') }}

      - name: Check the shipped parser and CLI
        run: cargo test --locked -p sc-treesitter -p sitr

  # Product contracts exercise the installed wheel and built CLIs over loopback HTTP.
  sc-agent-py:
    name: sc-decidr wheel and CLI contracts
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-sc-agent-py-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wheel build tool
        run: python -m pip install "maturin>=1.9,<2" "pyright==1.1.414"

      - name: Install the consumer template renderer
        run: cargo install sc-compose --version 1.9.0 --locked

      - name: Build, install and verify the shipped workspace
        run: python scripts/gate/rewrite.py

      - name: Type-check both installed-wheel consumer renders
        run: python scripts/check_consumer_template.py

      - name: Check CLI documentation drift
        run: |
          bash scripts/generate-cli-docs.sh
          git diff --exit-code -- fixtures/cli/ site/cli/

      - name: Check release metadata
        run: |
          python .github/scripts/release_artifacts.py validate-manifest --manifest release/publish-artifacts.toml --workspace-toml Cargo.toml
          python scripts/test_prerelease_tag.py

  # Dependency advisories (RustSec) and licenses, from deny.toml (RSH-002).
  # Exact pins such as ureq =3.5.1 are not floated, so this job is how a
  # published advisory against a pinned crate reaches the merge gate.
  deny:
    name: Dependency advisories and licenses
    needs: [detect]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny check advisories licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses

  boundary:
    name: sc-lint boundary
    needs: [detect]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Generated Just integration (sc-lint docs installation). The runner has no
      # `just`, so this runs the `just setup` recipe's command, then the boundary
      # check through the managed install. No lint or test profile.
      - name: Install sc-lint (just setup)
        run: python3 .sc-lint/bootstrap.py setup --config sc-lint.toml

      - name: sc-lint boundary check
        run: python3 .sc-lint/bootstrap.py exec --config sc-lint.toml -- sc-lint lint sc-boundary --config sc-lint.toml

  # The one required status check: it always reports, passes when every job
  # above succeeded or was skipped, and fails if any failed or was cancelled.
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [detect, fmt, clippy, test, treesitter, sc-agent-py, deny, boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a CI job ended $r"; exit 1;; esac
          done
