name: CI

on:
  pull_request:
    # `branches` filters on the PR *base*. Any branch a stacked layer can sit
    # on must be listed, or that layer's PR gets no CI at all. `*` does not
    # match `/`, which the lower-case naming rule already forbids in slugs.
    branches:
      - develop
      - main
      - "integrate/*"
      - "integration/*"
      - "sprint/*"
      - "fix/*"
      - "hotfix/*"
      - "feature/*"
      - "plan/*"
      - "docs/*"
      - "chore/*"
      - "ci/*"
      - "release/*"
      - "merge/*"
      - "evidence/*"
      - "triage/*"
  push:
    branches: [develop, main]

# One live run per ref: a new push to a PR branch cancels the queued/running
# run for the superseded commit instead of stacking a full matrix behind it.
# Pushes to develop/main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  # The Rust jobs run once the workspace exists (sprint a-1 adds the root
  # Cargo.toml). Until then they are skipped, which GitHub counts as passing
  # for required status checks.
  detect:
    name: Detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Look for the Cargo workspace
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; echo "No Cargo.toml yet: Rust jobs are skipped."; fi

  fmt:
    name: Format check
    needs: [detect]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    name: Clippy
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install sc-lint
        uses: ./.github/actions/setup-sc-lint
        with:
          version: "0.8.9"

      - name: Reject production panic constructs
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/sc-lint-runtime.json"
          set +e
          sc-lint --json lint sc-runtime --rule-filter SCB-RUNTIME-008 > "${report}"
          lint_rc=$?
          set -e
          if [ "${lint_rc}" -ne 0 ]; then
            cat "${report}"
            exit "${lint_rc}"
          fi
          export SC_LINT_RUNTIME_REPORT="${report}"
          python3 .github/scripts/tests/test_runtime_panic_gate.py

  test:
    name: Test (${{ matrix.os }})
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run workspace tests
        run: cargo test --workspace --all-features

  # sc-treesitter (sprint a-3): ADR-SAG-0005 feature gates, the grammar feature matrix and
  # the sc-treesitter-py wheel (REQ-QA-001, REQ-QA-002).
  treesitter:
    name: sc-treesitter features and wheel
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-treesitter-${{ hashFiles('**/Cargo.lock') }}

      - name: Check ADR-SAG-0005 feature gates (cargo metadata)
        run: |
          cargo metadata --format-version 1 --no-deps > metadata.json
          python3 - <<'PY'
          import json, sys
          packages = {p["name"]: p for p in json.load(open("metadata.json"))["packages"]}
          lib = packages["sc-treesitter"]
          default = lib["features"].get("default", [])
          problems = [f"`{f}` is a default feature" for f in ("python", "cli") if f in default]
          lib_bins = [t for t in lib["targets"] if "bin" in t["kind"]]
          if lib_bins:
              problems.append("sc-treesitter must not ship a bin target")
          if "cli" in lib["features"]:
              problems.append("sc-treesitter must not define a `cli` feature")
          sitr = packages.get("sitr")
          if sitr is None:
              problems.append("workspace must include the sitr CLI crate")
          elif not any("bin" in t["kind"] and t["name"] == "sitr" for t in sitr["targets"]):
              problems.append("sitr crate must ship the sitr binary")
          if problems:
              sys.exit("ADR-SAG-0005/a-13: " + "; ".join(problems))
          print(f"sc-treesitter default features {default}; sitr CLI crate present")
          PY

      - name: Test with only the Python grammar
        run: cargo test -p sc-treesitter --no-default-features --features grammar-python

      - name: Test the sitr CLI crate
        run: cargo test -p sitr

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin and pytest
        run: python -m pip install "maturin==1.9.4" "pytest==8.3.5"

      - name: Build the sc-treesitter wheel
        run: maturin build -m crates/sc-treesitter-py/Cargo.toml --out dist

      - name: Run the sc-treesitter-py tests
        run: |
          python -m pip install --no-index --find-links dist sitr
          python -m pytest crates/sc-treesitter-py/tests

  # sc-agent-py (sprint a-10): the sc-agent wheel over the decidr library, and its pytest
  # suite against a loopback runner (REQ-QA-007). The suite also runs the decidr binary.
  sc-agent-py:
    name: sc-agent-py wheel and pytest
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-sc-agent-py-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the decidr binary (the parity and identity tests run it)
        run: cargo build -p decidr

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin and pytest
        run: python -m pip install "maturin==1.9.4" "pytest==8.3.5" "sc-observability==1.5.0" "sc-compose==1.5.0"

      - name: Build the sc-agent wheel
        run: maturin build -m crates/sc-agent-py/Cargo.toml --out dist

      - name: Run the sc-agent-py tests
        run: |
          python -m pip install --no-index --find-links dist sc-decidr
          python -m pytest crates/sc-agent-py/tests

  # Dependency advisories (RustSec) and licenses, from deny.toml (RSH-002).
  # Exact pins such as ureq =3.5.1 are not floated, so this job is how a
  # published advisory against a pinned crate reaches the merge gate.
  deny:
    name: Dependency advisories and licenses
    needs: [detect]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny check advisories licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses

  # The one required status check: it always reports, passes when every job
  # above succeeded or was skipped, and fails if any failed or was cancelled.
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [detect, fmt, clippy, test, treesitter, sc-agent-py, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a CI job ended $r"; exit 1;; esac
          done
