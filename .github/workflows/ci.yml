name: CI

on:
  pull_request:
    # `branches` filters on the PR *base*. Any branch a stacked layer can sit
    # on must be listed, or that layer's PR gets no CI at all. `*` does not
    # match `/`, which the lower-case naming rule already forbids in slugs.
    branches:
      - develop
      - main
      - "integrate/*"
      - "integration/*"
      - "sprint/*"
      - "fix/*"
      - "hotfix/*"
      - "feature/*"
      - "plan/*"
      - "docs/*"
      - "chore/*"
      - "ci/*"
      - "release/*"
      - "merge/*"
      - "evidence/*"
      - "triage/*"
  push:
    branches: [develop, main]

# One live run per ref: a new push to a PR branch cancels the queued/running
# run for the superseded commit instead of stacking a full matrix behind it.
# Pushes to develop/main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  # The Rust jobs run once the workspace exists (sprint a-1 adds the root
  # Cargo.toml). Until then they are skipped, which GitHub counts as passing
  # for required status checks.
  detect:
    name: Detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Look for the Cargo workspace
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; echo "No Cargo.toml yet: Rust jobs are skipped."; fi

  fmt:
    name: Format check
    needs: [detect]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo --locked fmt --check --all

  clippy:
    name: Clippy
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - name: Set up released sc-lint
        run: just setup

      - name: Install Windows cross-lint tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes llvm nasm
          llvm_lib="$(command -v llvm-lib || find /usr/bin -maxdepth 1 -name 'llvm-lib-*' -executable -print -quit)"
          test -n "${llvm_lib}"
          sudo ln -sf "${llvm_lib}" /usr/local/bin/llvm-lib

      - name: Run consumer lint profile
        run: just lint ci all


  test:
    name: Test (${{ matrix.os }})
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check standalone decidr does not link Python
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked -p decidr
          linked_libs="$(ldd target/debug/decidr)"
          if [[ "$linked_libs" == *libpython* ]]; then
            echo "Standalone decidr unexpectedly links libpython"
            exit 1
          fi

      # All-features workspace builds unify sc-agent-log's Python feature into decidr.
      # The standalone decidr build does not enable that feature or need libpython.
      - name: Expose Python shared library to workspace tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python_libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          test -n "$python_libdir"
          echo "LD_LIBRARY_PATH=${python_libdir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

  python-logging:
    name: Embedded Python logging
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "sc-observability==1.5.0"
      - run: cargo test --locked --manifest-path crates/sc-agent-log/python-tests/Cargo.toml

  # sc-treesitter (sprint a-3): ADR-SAG-0005 feature gates, the grammar feature matrix and
  # the sc-treesitter-py wheel (REQ-QA-001, REQ-QA-002).
  treesitter:
    name: sc-treesitter features and wheel
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-treesitter-${{ hashFiles('**/Cargo.lock') }}

      - name: Check ADR-SAG-0005 feature gates (cargo metadata)
        run: |
          cargo metadata --locked --format-version 1 --no-deps > metadata.json
          python3 - <<'PY'
          import json, sys
          packages = {p["name"]: p for p in json.load(open("metadata.json"))["packages"]}
          lib = packages["sc-treesitter"]
          default = lib["features"].get("default", [])
          problems = [f"`{f}` is a default feature" for f in ("python", "cli") if f in default]
          lib_bins = [t for t in lib["targets"] if "bin" in t["kind"]]
          if lib_bins:
              problems.append("sc-treesitter must not ship a bin target")
          if "cli" in lib["features"]:
              problems.append("sc-treesitter must not define a `cli` feature")
          sitr = packages.get("sitr")
          if sitr is None:
              problems.append("workspace must include the sitr CLI crate")
          elif not any("bin" in t["kind"] and t["name"] == "sitr" for t in sitr["targets"]):
              problems.append("sitr crate must ship the sitr binary")
          if problems:
              sys.exit("ADR-SAG-0005/a-13: " + "; ".join(problems))
          print(f"sc-treesitter default features {default}; sitr CLI crate present")
          PY

      - name: Test with only the Python grammar
        run: cargo test --locked -p sc-treesitter --no-default-features --features grammar-python

      - name: Test the sitr CLI crate
        run: cargo test --locked -p sitr

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin and pytest
        run: python -m pip install "maturin==1.9.4" "pytest==8.3.5"

      - name: Build the sc-treesitter wheel
        run: maturin build --locked -m crates/sc-treesitter-py/Cargo.toml --out dist

      - name: Run the sc-treesitter-py tests
        run: |
          python -m pip install dist/sitr-*.whl
          python -m pytest crates/sc-treesitter-py/tests

  # sc-agent-py (sprint a-10): the sc-agent wheel over the decidr library, and its pytest
  # suite against a loopback runner (REQ-QA-007). The suite also runs the decidr binary.
  sc-agent-py:
    name: sc-agent-py wheel and pytest
    needs: [detect, fmt]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-sc-agent-py-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the decidr binary (the parity and identity tests run it)
        run: cargo build --locked -p decidr

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin and pytest
        run: python -m pip install "maturin==1.9.4" "pytest==8.3.5" "sc-observability==1.5.0" "sc-compose==1.5.0"

      - name: Install sc-compose CLI at the template floor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("floors.toml", "rb"))["tools"]["sc-compose"])')
          asset="sc-compose_${version}_x86_64-unknown-linux-gnu.tar.gz"
          install_dir="${RUNNER_TEMP}/sc-compose-cli"
          mkdir -p "${install_dir}"
          gh release download "v${version}" --repo randlee/sc-compose \
            --pattern "${asset}" --pattern checksums.txt --dir "${install_dir}"
          (cd "${install_dir}" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "${install_dir}/${asset}" -C "${install_dir}" --strip-components=1
          "${install_dir}/bin/sc-compose" --version
          echo "${install_dir}/bin" >> "$GITHUB_PATH"

      - name: Build the decision and optional sitr wheels
        run: |
          maturin build --locked -m crates/sc-agent-py/Cargo.toml --out dist
          maturin build --locked -m crates/sc-treesitter-py/Cargo.toml --out dist

      - name: Run the sc-agent-py tests
        run: |
          python -m pip install dist/sc_decidr-*.whl dist/sitr-*.whl
          python -m pytest crates/sc-agent-py/tests

  # Dependency advisories (RustSec) and licenses, from deny.toml (RSH-002).
  # Exact pins such as ureq =3.5.1 are not floated, so this job is how a
  # published advisory against a pinned crate reaches the merge gate.
  deny:
    name: Dependency advisories and licenses
    needs: [detect]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny check advisories licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses

  # The one required status check: it always reports, passes when every job
  # above succeeded or was skipped, and fails if any failed or was cancelled.
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [detect, fmt, clippy, test, python-logging, treesitter, sc-agent-py, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a CI job ended $r"; exit 1;; esac
          done
