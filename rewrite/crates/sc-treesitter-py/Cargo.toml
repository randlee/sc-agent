[package]
name = "sc-treesitter-py"
version = "0.1.0"
edition = "2024"

[lib]
name = "sc_treesitter"
crate-type = ["cdylib"]

[dependencies]
sc-agent = { path = "../sc-agent" }
sc-treesitter = { path = "../sc-treesitter" }
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module"] }
