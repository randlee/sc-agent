[workspace]
members = ["sc-agent", "decidr", "sc-agent-py", "sc-treesitter", "sitr"]
resolver = "3"
[workspace.package]
version = "0.2.8"
edition = "2024"
license = "MIT"
[workspace.dependencies]
sc-agent = { path = "sc-agent" }
sc-treesitter = { path = "sc-treesitter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sc-observability = { version = "=1.5.0", default-features = false }
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
