[tool.sc-lint]
minimum_version = "0.8.9"
default_lint_profile = "ci"

[tool.sc-lint.analyzers.boundary]
enabled = true
reason = "Enforce the declared crate boundaries and publishable Cargo dependencies."
# A path-only self dev-dependency enables the crate's existing tests; pinning
# its unpublished version makes Cargo resolve it from crates.io during package.
# Normal/build dependencies retain their publishable workspace versions.
# Forwarding to Arc<T>/&T calls T's implementation, not the forwarding method;
# serde remote=Self resolves to the generated serializer, not the wrapper method.
exclude_paths_by_rule = { "SCB-MANIFEST-002" = ["crates/sc-agent-types/Cargo.toml"], "SCB-CYCLE-003" = ["crates/sc-agent-http/src/transport.rs", "crates/sc-decision-schema/src/models.rs", "crates/sc-decision-schema/src/request.rs", "crates/sc-decision-schema/src/response.rs"] }

[tool.sc-lint.analyzers.portability]
enabled = true
reason = "Both product binaries and Python bindings support Linux, macOS and Windows."
targets = ["linux", "macos", "windows"]
fail_rules = ["PORT-001", "PORT-002", "PORT-003", "PORT-004", "PORT-005", "PORT-006", "PORT-007", "PORT-008", "PORT-009", "PORT-010"]

[tool.sc-lint.analyzers.runtime]
enabled = true
reason = "Enforce bounded production waits, runtime safety and production panic prohibition."
# The released analyzer requires exact package names to enable its panic rule.
# The dev-only testkit is excluded because its helpers intentionally fail tests.
panic_rule_packages = ["decidr", "sc-agent-config", "sc-agent-http", "sc-agent-log", "sc-agent-py", "sc-agent-secrets", "sc-agent-types", "sc-decision-llm", "sc-decision-local", "sc-decision-runner", "sc-decision-schema", "sc-decision-systemone", "sc-llm-provider", "sc-treesitter", "sc-treesitter-py", "sitr"]
# Only the feature-gated manual clock reaches the untimed wait; real-clock
# production waits always use wait_timeout. Manual time advances by notification.
exclude_paths_by_rule = { "SCB-RUNTIME-001" = ["crates/sc-agent-types/src/clock.rs"] }

[[tool.sc-lint.lint]]
name = "fmt"
command = ["cargo", "fmt", "--all", "--check"]

[[tool.sc-lint.lint]]
name = "clippy"
command = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[[tool.sc-lint.lint]]
name = "sc-boundary"
command = ["sc-lint", "lint", "sc-boundary", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "sc-portability"
command = ["sc-lint", "lint", "sc-portability", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "sc-runtime"
command = ["sc-lint", "lint", "sc-runtime", "--config", "sc-lint.toml"]

# All platform scopes add cross-target validation: just lint ci all.
# sc-lint selects cargo-xwin on non-Windows and native Cargo on Windows.
[[tool.sc-lint.lint]]
name = "windows-clippy"
command = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
platform = "windows"
target = "x86_64-pc-windows-msvc"

[tool.sc-lint.lint_profiles]
ci = ["fmt", "clippy", "sc-boundary", "sc-portability", "sc-runtime", "windows-clippy"]

[[tool.sc-lint.test]]
name = "workspace"
command = ["cargo", "test", "--locked", "--workspace", "--all-features"]
