[tool.sc-lint]
minimum_version = "0.8.9"
default_lint_profile = "ci"

[tool.sc-lint.analyzers.runtime]
panic_rule_packages = ["decidr", "sc-agent-config", "sc-agent-http", "sc-agent-log", "sc-agent-py", "sc-agent-secrets", "sc-agent-types", "sc-decision-llm", "sc-decision-local", "sc-decision-runner", "sc-decision-schema", "sc-decision-systemone", "sc-llm-provider", "sc-treesitter", "sc-treesitter-py", "sitr"]

[[tool.sc-lint.lint]]
name = "boundary"
command = ["sc-lint", "lint", "sc-boundary", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "portability"
command = ["sc-lint", "lint", "sc-portability", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "runtime-panic"
command = ["sc-lint", "lint", "sc-runtime", "--root", ".", "--config", "sc-lint.toml", "--rule-filter", "SCB-RUNTIME-008"]

[tool.sc-lint.lint_profiles]
ci = ["boundary", "portability", "runtime-panic"]

[tool.sc-lint.analyzers.portability]
fail_rules = ["PORT-001", "PORT-002", "PORT-003", "PORT-004", "PORT-005", "PORT-006", "PORT-007", "PORT-008", "PORT-009", "PORT-010"]

# This mirrors the existing cross-platform CI test job; `lint ci --consumer`
# validates its presence but does not execute test selectors.
[[tool.sc-lint.test]]
name = "workspace"
command = ["cargo", "test", "--locked", "--workspace", "--all-features"]
