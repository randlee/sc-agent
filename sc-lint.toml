# Generated by sc-lint; user edits are preserved by future init runs.
# User-owned configuration: edit lint/test steps as needed. `sc-lint init --just` seeds
# this file only when it is missing and never rewrites it.
[tool.sc-lint]
minimum_version = "0.8.9"

# Only the boundary analyzer is on (phase-m sprint m-0). Portability, runtime,
# line-count and function-length checks stay off.
[tool.sc-lint.analyzers.boundary]
enabled = true
reason = "Phase-m layering: each new crate depends only on the layers its boundaries/ record allows."
# The existing crates are left out of the check; they have no boundaries/ record and m-0 does not edit them.
exclude_paths = ["crates/sc-agent/**", "crates/decidr/**", "crates/sc-agent-py/**", "crates/sc-treesitter/**", "crates/sitr/**"]

[[tool.sc-lint.analyzers.boundary.global_dependency_ownership]]
dependency = "rusqlite"
allowed_manifest_paths = ["crates/sc-agent-sqlite/Cargo.toml"]
allowed_source_roots = ["crates/sc-agent-sqlite/src", "crates/sc-agent-sqlite/tests"]
manifest_message = "Only sc-agent-sqlite may depend on rusqlite."
source_message = "Only sc-agent-sqlite may use rusqlite."

[tool.sc-lint.analyzers.portability]
enabled = false
reason = "Not enabled in phase-m m-0."

[tool.sc-lint.analyzers.runtime]
enabled = false
reason = "Not enabled in phase-m m-0."
