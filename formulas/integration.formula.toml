formula = "integration"
description = "Live checksum-verified sc-agent prerelease provider integration"
version = 1
type = "workflow"

[[steps]]
id = "verify_assets"
title = "Verify prerelease assets for {{run_id}}"
description = "Download and verify the target binary archive and both wheel SHA-256 values before any case."
type = "task"

[[steps]]
id = "typesafe_models_cli"
title = "Live typesafe-models-cli for {{run_id}}"
description = "Run scripts/integration/run.py --case typesafe-models-cli; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "typesafe_models_wheel"
title = "Live typesafe-models-wheel for {{run_id}}"
description = "Run scripts/integration/run.py --case typesafe-models-wheel; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "typesafe_decision_cli"
title = "Live typesafe-decision-cli for {{run_id}}"
description = "Run scripts/integration/run.py --case typesafe-decision-cli; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "typesafe_decision_wheel"
title = "Live typesafe-decision-wheel for {{run_id}}"
description = "Run scripts/integration/run.py --case typesafe-decision-wheel; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "anthropic_decision_cli"
title = "Live anthropic-decision-cli for {{run_id}}"
description = "Run scripts/integration/run.py --case anthropic-decision-cli; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "anthropic_decision_wheel"
title = "Live anthropic-decision-wheel for {{run_id}}"
description = "Run scripts/integration/run.py --case anthropic-decision-wheel; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "typesafe_invalid_key_cli"
title = "Live typesafe-invalid-key-cli for {{run_id}}"
description = "Run scripts/integration/run.py --case typesafe-invalid-key-cli; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication. Expected authentication cause chain: decision.api_status."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "typesafe_invalid_key_wheel"
title = "Live typesafe-invalid-key-wheel for {{run_id}}"
description = "Run scripts/integration/run.py --case typesafe-invalid-key-wheel; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication. Expected authentication cause chain: decision.api_status."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "anthropic_invalid_key_cli"
title = "Live anthropic-invalid-key-cli for {{run_id}}"
description = "Run scripts/integration/run.py --case anthropic-invalid-key-cli; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication. Expected authentication cause chain: decision.backend -> decision_llm.llm -> llm.api_status."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "anthropic_invalid_key_wheel"
title = "Live anthropic-invalid-key-wheel for {{run_id}}"
description = "Run scripts/integration/run.py --case anthropic-invalid-key-wheel; persist its sanitized PASS, FAIL or SKIP result. SKIP never passes publication. Expected authentication cause chain: decision.backend -> decision_llm.llm -> llm.api_status."
type = "task"
needs = ["verify_assets"]

[[steps]]
id = "report"
title = "Render and publish XHTML for {{run_id}}"
description = "Render the owner-selected XHTML template with sc-compose; validate XML, commit and push this platform report and its per-case results."
type = "task"
needs = ["typesafe_models_cli", "typesafe_models_wheel", "typesafe_decision_cli", "typesafe_decision_wheel", "anthropic_decision_cli", "anthropic_decision_wheel", "typesafe_invalid_key_cli", "typesafe_invalid_key_wheel", "anthropic_invalid_key_cli", "anthropic_invalid_key_wheel"]
