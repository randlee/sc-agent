# ATM configuration for sc-agent (Synaptic Canvas agent runtime).
#
# Runtime identity (see `atm help identity`):
#   export ATM_IDENTITY=ai-lead ATM_TEAM=sc-ai
#
# Register the team on the ATM daemon before first use, for example:
#   atm teams add-member sc-ai ai-lead --agent-type lead --model opus \
#     --home-dir "<path-to-primary-checkout>" --backend herdr --session default
#   atm teams add-member sc-ai tai --agent-type developer --model gpt-5.6-terra-medium \
#     --home-dir "<path-to-primary-checkout>" --backend herdr --session default
#   atm teams add-member sc-ai lai --agent-type developer --model gpt-5.6-luna-medium \
#     --home-dir "<path-to-primary-checkout>" --backend herdr --session default
#   atm teams add-member sc-ai sai --agent-type developer --model gpt-5.6-sol-medium \
#     --home-dir "<path-to-primary-checkout>" --backend herdr --session default
#   atm teams add-member sc-ai ai-qa --agent-type qa --model sonnet \
#     --home-dir "<path-to-primary-checkout>" --backend herdr --session default
#
# Orchestration: pass `--var lead=ai-lead` and dispatch QA to `ai-qa` (quality-mgr role;
# prompt file remains `.claude/agents/quality-mgr.md`).

[atm]
default_team = "sc-ai"

[rmux]
session = "sc-ai"

[[rmux.windows]]
name = "lead"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "ai-lead"
model = "opus"
env = { ATM_IDENTITY = "ai-lead", ATM_TEAM = "sc-ai", CLAUDE_CODE_TASK_LIST_ID = "sc-ai" }

[[rmux.windows.panes]]
name = "ai-qa"
model = "sonnet"
env = { ATM_IDENTITY = "ai-qa", ATM_TEAM = "sc-ai", CLAUDE_CODE_TASK_LIST_ID = "sc-ai" }

[[rmux.windows]]
name = "developers"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "tai"
command = "codex -c features.hooks=true -m gpt-5.6-terra-medium --yolo"
env = { ATM_IDENTITY = "tai", ATM_TEAM = "sc-ai", CLAUDE_CODE_TASK_LIST_ID = "sc-ai" }

[[rmux.windows.panes]]
name = "lai"
command = "codex -c features.hooks=true -m gpt-5.6-luna-medium --yolo"
env = { ATM_IDENTITY = "lai", ATM_TEAM = "sc-ai", CLAUDE_CODE_TASK_LIST_ID = "sc-ai" }

[[rmux.windows.panes]]
name = "sai"
command = "codex -c features.hooks=true -m gpt-5.6-sol-medium --yolo"
env = { ATM_IDENTITY = "sai", ATM_TEAM = "sc-ai", CLAUDE_CODE_TASK_LIST_ID = "sc-ai" }
