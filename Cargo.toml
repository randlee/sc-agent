[workspace]
members = [
    "crates/decidr",
    "crates/sc-agent-config",
    "crates/sc-agent-http",
    "crates/sc-agent-log",
    "crates/sc-agent-py",
    "crates/sc-agent-secrets",
    "crates/sc-agent-testkit",
    "crates/sc-agent-types",
    "crates/sc-decision-llm",
    "crates/sc-decision-local",
    "crates/sc-decision-runner",
    "crates/sc-decision-schema",
    "crates/sc-decision-systemone",
    "crates/sc-llm-provider",
    "crates/sc-treesitter",
    "crates/sc-treesitter-py",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"

[workspace.lints.rust]
# `deny`, not `forbid`: PyO3's `#[pymodule]`/`#[pyfunction]` expansions carry
# `#[allow(unsafe_code)]`, which a workspace `forbid` would reject. Every non-PyO3
# crate adds `#![forbid(unsafe_code)]` at its crate root.
unsafe_code = "deny"

[workspace.lints.clippy]
# REQ-SAG-0002 AC2; clippy.toml allows these in tests only.
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
