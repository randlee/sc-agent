[workspace]
members = ["crates/sc-agent", "crates/decidr", "crates/sc-agent-py", "crates/sc-treesitter", "crates/sitr"]
resolver = "3"
[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.98.1"
repository = "https://github.com/randlee/sc-agent"
readme = "README.md"
[workspace.dependencies]
sc-agent = { path = "crates/sc-agent", version = "0.4.0" }
sc-treesitter = { path = "crates/sc-treesitter", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sc-observability = { version = "=1.5.0", default-features = false }
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
