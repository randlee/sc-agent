[workspace]
resolver = "2"
members = [
    "crates/sc-agent-types",
    "crates/sc-agent-secrets",
    "crates/sc-jev",
    "crates/sc-jev-backends",
    "crates/sc-jev-check",
    "crates/sc-treesitter",
    "crates/sc-ai",
    "crates/sc-jev-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Rand Lee <github@randlee.com>"]
license = "MIT"
repository = "https://github.com/randlee/sc-agent"
homepage = "https://github.com/randlee/sc-agent"
# Shared crates.io metadata. Crates add their own `keywords` / `categories`
# when the shared values do not fit (sc-ai, sc-treesitter).
keywords = ["llm", "evaluation", "jev", "sc-agent"]
categories = ["development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
toml = "1.1.8"
ureq = "3.5.1"
# Dependency pinning policy (docs/development/sc-publish.md): the `=` pins
# below are deliberate lockstep with the sc-observability release train and
# with the sc-ai / sc-treesitter binaries' tested allocator. Caret relaxation
# for library crates is revisited at the Phase A architectural review.
sc-observability = "=1.5.0"
sc-observability-types = "=1.5.0"
mimalloc = "=0.1.52"
# Dev-only. Tests use tempfile::TempDir instead of hand-rolled temp dirs.
tempfile = "3"

# Every crate opts in with `[lints] workspace = true`. sc-jev-py keeps its own
# lint settings (PyO3 macros); wave 3 of a-10 decides how it opts in.
[workspace.lints.rust]
unsafe_code = "forbid"
