[workspace]
members = [
    "crates/decidr",
    "crates/sc-agent-config",
    "crates/sc-agent-http",
    "crates/sc-agent-log",
    "crates/sc-agent-py",
    "crates/sc-agent-secrets",
    "crates/sc-agent-testkit",
    "crates/sc-agent-types",
    "crates/sc-decision-llm",
    "crates/sc-decision-local",
    "crates/sc-decision-runner",
    "crates/sc-decision-schema",
    "crates/sc-decision-systemone",
    "crates/sc-llm-provider",
    "crates/sc-treesitter",
    "crates/sc-treesitter-py",
    "crates/sitr",
]
resolver = "3"

[workspace.package]
authors = ["Rand Lee"]
repository = "https://github.com/randlee/sc-agent"
homepage = "https://github.com/randlee/sc-agent"
version = "0.2.7"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"

[workspace.dependencies]
decidr = { path = "crates/decidr", version = "0.2.7" }
sc-agent-config = { path = "crates/sc-agent-config", version = "0.2.7" }
sc-agent-http = { path = "crates/sc-agent-http", version = "0.2.7" }
sc-agent-log = { path = "crates/sc-agent-log", version = "0.2.7" }
sc-agent-py = { path = "crates/sc-agent-py", version = "0.2.7" }
sc-agent-secrets = { path = "crates/sc-agent-secrets", version = "0.2.7" }
sc-agent-testkit = { path = "crates/sc-agent-testkit" }
sc-agent-types = { path = "crates/sc-agent-types", version = "0.2.7" }
sc-decision-llm = { path = "crates/sc-decision-llm", version = "0.2.7" }
sc-decision-local = { path = "crates/sc-decision-local", version = "0.2.7" }
sc-decision-runner = { path = "crates/sc-decision-runner", version = "0.2.7" }
sc-decision-schema = { path = "crates/sc-decision-schema", version = "0.2.7" }
sc-decision-systemone = { path = "crates/sc-decision-systemone", version = "0.2.7" }
sc-llm-provider = { path = "crates/sc-llm-provider", version = "0.2.7" }
sc-treesitter = { path = "crates/sc-treesitter", version = "0.2.7", default-features = false }
sc-treesitter-py = { path = "crates/sc-treesitter-py", version = "0.2.7" }
sitr = { path = "crates/sitr", version = "0.2.7" }
[workspace.lints.rust]
# `deny`, not `forbid`: PyO3's `#[pymodule]`/`#[pyfunction]` expansions carry
# `#[allow(unsafe_code)]`, which a workspace `forbid` would reject. Every non-PyO3
# crate adds `#![forbid(unsafe_code)]` at its crate root.
unsafe_code = "deny"

[workspace.lints.clippy]
# REQ-SAG-0002 AC2; clippy.toml allows these in tests only.
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
