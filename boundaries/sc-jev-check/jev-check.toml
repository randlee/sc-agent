# Boundary manifest for sc-jev-check. Checked by `sc-lint lint sc-boundary` (`just lint`).
#
# Conventions (Phase A phase-end, RBQA-F001 option B):
# - `allowed_dependencies` lists EVERY direct normal (non-dev) dependency in
#   crates/sc-jev-check/Cargo.toml, workspace and third-party, including optional and
#   target-specific ones. Dev-dependencies are not listed.
# - `forbidden_edges` are direct edges only; transitive reachability is not
#   checked.
# - What sc-lint 0.8.0 enforces from this file: workspace-to-workspace edges
#   (SCB-DEPENDENCY-001 unlisted edge, -002 unlisted dependent, -003 forbidden
#   edge present, -004 stale dependent permission). Third-party names here are
#   accepted but not enforced by sc-boundary; the third-party edges that matter
#   are enforced by the `global_dependency_ownership` records in sc-lint.toml
#   (SCB-MANIFEST-004). Enforcement is Cargo-edge only: sc-lint 0.8.0 accepts
#   `references.forbidden` entries but does not report on them, so this file
#   declares none.

boundary_id = "BOUNDARY-jev-check"
owner_package = "sc-jev-check"
owner_crate_path = "sc_jev_check"
name = "jev-check"

[public]
facade = "sc_jev_check::run::prepare, sc_jev_check::run::run, sc_jev_check::run::discover_repo_root, sc_jev_check::run::CheckSource, sc_jev_check::run::CallerRequest, sc_jev_check::run::RunConfig, sc_jev_check::run::PreparedRun, sc_jev_check::run::RunResponse, sc_jev_check::run::BackendResult, sc_jev_check::run::BackendStatus, sc_jev_check::run::BackendFailure, sc_jev_check::run::BackendLimit, sc_jev_check::run::Envelope, sc_jev_check::run::ENVELOPE_VERSION, sc_jev_check::run::OP_RUN, sc_jev_check::run::OP_DRY_RUN, sc_jev_check::run::OP_ASK, sc_jev_check::run::RunResponseBuilder, sc_jev_check::config::load_check_at, sc_jev_check::config::CheckSpec, sc_jev_check::config::InputSpec, sc_jev_check::session::FileSessionStore, sc_jev_check::registry::BackendRegistry, sc_jev_check::registry::register_scripted_backends"
notes = "Facade (r-2, ADR-SAG-0024): the only run entry points are prepare, run and discover_repo_root (REQ-SAG-0620); RunResponse and its parts plus Envelope (and its version/operation constants, moved here from sc-ai) are the one response contract. registry::register_scripted_backends and run::RunResponseBuilder (RunResponse::test_builder) exist only under the test-util feature, which enables sc-agent-types/test-util; this crate's own integration target run_response declares [[test]] required-features = [\"test-util\"] (no self dev-dependency, boundaries/README.md D0 outcome 4). registry::ScriptedJudge and registry::RequestLog were deleted in r-1; the private FACTORIES table is covered by a --lib test. Deleted in r-2: run_check, run_request, build_request, prepare_caller_request, CheckResult, BuiltRequest, RunRequest, PreparedCallerRequest, RunOptions, SessionStore, registry_for_repo, the Extractor trait, PayloadBuilder and PackagedConfig. Still pub because crate tests import them: config::load_check_str, config::PACKAGED_SYSTEM_PROMPT, extract::extract_input, payload::build_payload, payload::parse_question_set, equal_input::producer_from_extractions, session::{StoredSession, SESSION_CONTEXT_HEADER, STALE_TMP_AGE}. sc-agent-types is a normal dependency with features = [\"git\"] (discover_toplevel, read_at_rev)."

[implementation]
type = "marker"
module = "sc_jev_check"
visibility = "public"
constructor = "none"

[composition]
roots = ["config", "extract", "payload", "run", "session", "equal_input", "registry"]

[dependencies]
allowed_dependents = ["sc-ai", "sc-jev-py"]
allowed_dependencies = ["sc-agent-secrets", "sc-agent-types", "sc-jev", "sc-jev-backends", "serde", "serde_json", "toml"]
forbidden_edges = [
    { from = "sc-jev-check", to = "sc-treesitter" },
    { from = "sc-jev-check", to = "ureq" },
    { from = "sc-jev-check", to = "tree-sitter" },
    { from = "sc-jev-check", to = "tree-sitter-python" },
    { from = "sc-jev-check", to = "tree-sitter-rust" },
    { from = "sc-jev-check", to = "pyo3" },
    { from = "sc-jev-check", to = "sc-observability" },
]

# Required by the sc-lint 0.8.0 inventory schema. Not enforced: the
# validator accepts entries here but reports nothing for them.
[references]
scope = "outside_owner_crate"
forbidden = []

# Required by the schema. Declarative: sc-lint 0.8.0 reports nothing for
# these fields. Paths name the feature-gated (`test-util`) test doubles.
[testing]
allowed_test_double_paths = ["crates/sc-jev-check/src/registry/scripted.rs"]
forbidden_test_bypasses = []

# The sc-lint rules that check this boundary on every `just lint`. Listing
# them here is documentation; sc-lint 0.8.0 does not read this field.
[enforcement]
lint_rules = ["SCB-DEPENDENCY-001", "SCB-DEPENDENCY-002", "SCB-DEPENDENCY-003", "SCB-DEPENDENCY-004", "SCB-MANIFEST-004"]
review_gates = []

[status]
state = "concrete_landed"
