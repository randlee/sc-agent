# Boundary manifest for sc-jev-check. Checked by `sc-lint lint sc-boundary` (`just lint`).
#
# Conventions (Phase A phase-end, RBQA-F001 option B):
# - `allowed_dependencies` lists EVERY direct normal (non-dev) dependency in
#   crates/sc-jev-check/Cargo.toml, workspace and third-party, including optional and
#   target-specific ones. Dev-dependencies are not listed.
# - `forbidden_edges` are direct edges only; transitive reachability is not
#   checked.
# - What sc-lint 0.8.0 enforces from this file: workspace-to-workspace edges
#   (SCB-DEPENDENCY-001 unlisted edge, -002 unlisted dependent, -003 forbidden
#   edge present, -004 stale dependent permission). Third-party names here are
#   accepted but not enforced by sc-boundary; the third-party edges that matter
#   are enforced by the `global_dependency_ownership` records in sc-lint.toml
#   (SCB-MANIFEST-004). Enforcement is Cargo-edge only: sc-lint 0.8.0 accepts
#   `references.forbidden` entries but does not report on them, so this file
#   declares none.

boundary_id = "BOUNDARY-jev-check"
owner_package = "sc-jev-check"
owner_crate_path = "sc_jev_check"
name = "jev-check"

[public]
facade = "sc_jev_check::config::load_check_at, sc_jev_check::config::CheckSpec, sc_jev_check::config::PACKAGED_SYSTEM_PROMPT, sc_jev_check::run::run_check, sc_jev_check::run::run_request, sc_jev_check::run::build_request, sc_jev_check::run::prepare_caller_request, sc_jev_check::run::RunOptions, sc_jev_check::run::RunRequest, sc_jev_check::run::CheckResult, sc_jev_check::run::BuiltRequest, sc_jev_check::run::PreparedCallerRequest, sc_jev_check::session::FileSessionStore, sc_jev_check::session::SessionStore, sc_jev_check::registry::BackendRegistry, sc_jev_check::registry::registry_for_repo, sc_jev_check::registry::register_scripted_backends"
notes = "Facade lists what sc-ai and sc-jev-py use (ARCHE-017). Extractor structs, read helpers, subjects validation, refuse_over_cap, parse_state, equal_input record helpers, render_session_context, FileSessionStore::load_raw and backend_key_id are pub(crate). Still pub because crate tests import them: payload::PayloadBuilder, payload::parse_question_set, equal_input::producer_from_extractions, session::SESSION_CONTEXT_HEADER. prepare_caller_request and PreparedCallerRequest live in payload and are re-exported from run. register_scripted_backends is behind the test-util feature, which enables sc-agent-types/test-util and builds MockJudgeBackends (r-1; sc-ai enables it as a dev-dependency). The rest of this manifest is r-2's."

[implementation]
type = "marker"
module = "sc_jev_check"
visibility = "public"
constructor = "none"

[composition]
roots = ["config", "extract", "payload", "run", "session", "equal_input", "registry"]

[dependencies]
allowed_dependents = ["sc-ai", "sc-jev-py"]
allowed_dependencies = ["sc-agent-secrets", "sc-agent-types", "sc-jev", "sc-jev-backends", "serde", "serde_json", "toml"]
forbidden_edges = [
    { from = "sc-jev-check", to = "sc-treesitter" },
    { from = "sc-jev-check", to = "ureq" },
    { from = "sc-jev-check", to = "tree-sitter" },
    { from = "sc-jev-check", to = "tree-sitter-python" },
    { from = "sc-jev-check", to = "tree-sitter-rust" },
    { from = "sc-jev-check", to = "pyo3" },
    { from = "sc-jev-check", to = "sc-observability" },
]

# Required by the sc-lint 0.8.0 inventory schema. Not enforced: the
# validator accepts entries here but reports nothing for them.
[references]
scope = "outside_owner_crate"
forbidden = []

# Required by the schema. Declarative: sc-lint 0.8.0 reports nothing for
# these fields. Paths name the feature-gated (`test-util`) test doubles.
[testing]
allowed_test_double_paths = ["crates/sc-jev-check/src/registry/scripted.rs"]
forbidden_test_bypasses = []

# The sc-lint rules that check this boundary on every `just lint`. Listing
# them here is documentation; sc-lint 0.8.0 does not read this field.
[enforcement]
lint_rules = ["SCB-DEPENDENCY-001", "SCB-DEPENDENCY-002", "SCB-DEPENDENCY-003", "SCB-DEPENDENCY-004", "SCB-MANIFEST-004"]
review_gates = []

[status]
state = "concrete_landed"
