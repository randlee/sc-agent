[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "sc-decision-systemone"
version.workspace = true
description = "System One decision backend for sc-agent: sans-IO encode/decode of POST /v1/systemone and GET /v1/models for Jev and any System One server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sc-agent-http = { workspace = true }
sc-agent-secrets = { workspace = true }
sc-agent-types = { workspace = true }
sc-decision-schema = { workspace = true }
# preserve_order: bodies keep the request's key order; float_roundtrip: probabilities decode
# unrounded (REQ-SAG-0007).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Multipart boundary: "sc-agent-" + a fresh ULID per encode (REQ-SAG-0001).
ulid = "1"

[dev-dependencies]
sc-agent-secrets = { workspace = true, features = ["test-keyring-guard"] }
sc-agent-testkit = { workspace = true }
sc-agent-http = { workspace = true, features = ["testing"] }

[lints]
workspace = true
