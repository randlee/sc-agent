[package]
name = "sc-decision-local"
version.workspace = true
description = "Local System One decision backend for sc-agent: a configured Jev-compatible daemon (Strands Decider, Laya, Mapika/decider, generic) with model discovery."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sc-agent-config = { path = "../sc-agent-config", version = "0.1.5" }
sc-agent-http = { path = "../sc-agent-http", version = "0.1.5" }
sc-agent-log = { path = "../sc-agent-log", version = "0.1.5" }
sc-agent-secrets = { path = "../sc-agent-secrets", version = "0.1.5" }
sc-agent-types = { path = "../sc-agent-types", version = "0.1.5" }
sc-decision-schema = { path = "../sc-decision-schema", version = "0.1.5" }
sc-decision-systemone = { path = "../sc-decision-systemone", version = "0.1.5" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
sc-agent-secrets = { path = "../sc-agent-secrets", features = ["test-keyring-guard"] }
sc-agent-testkit = { path = "../sc-agent-testkit" }
sc-agent-http = { path = "../sc-agent-http", features = ["testing"] }
sc-agent-log = { path = "../sc-agent-log", features = ["testing"] }

[lints]
workspace = true
