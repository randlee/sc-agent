[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "sc-decision-local"
version.workspace = true
description = "Local System One decision backend for sc-agent: a configured Jev-compatible daemon (Strands Decider, Laya, Mapika/decider, generic) with model discovery."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sc-agent-config = { workspace = true }
sc-agent-http = { workspace = true }
sc-agent-log = { workspace = true }
sc-agent-secrets = { workspace = true }
sc-agent-types = { workspace = true }
sc-decision-schema = { workspace = true }
sc-decision-systemone = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
sc-agent-secrets = { workspace = true, features = ["test-keyring-guard"] }
sc-agent-testkit = { workspace = true }
sc-agent-http = { workspace = true, features = ["testing"] }
sc-agent-log = { workspace = true, features = ["testing"] }

[lints]
workspace = true
