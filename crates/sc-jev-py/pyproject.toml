# Wheel CI (maturin build + tests/fixtures/jev-python pytest) is sprint a-9
# (REQ-SAG-0803). This sprint proves the wheel with local maturin build.
[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "sc-jev-py"
description = "PyO3 bindings over sc-jev-check."
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["version"]

[tool.maturin]
features = ["extension-module"]
module-name = "sc_jev_py"
