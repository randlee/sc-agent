# Wheels are built and published by the sc-publish kit (sprint a-9,
# REQ-SAG-0803). See docs/development/sc-publish.md.
[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "sc-jev-py"
description = "PyO3 bindings over sc-jev-check."
requires-python = ">=3.11"
license = { text = "MIT" }
# Static and equal to [workspace.package].version: sc-publish
# `sync-python-version` rejects dynamic versions (sprint a-9).
version = "0.1.0"

[tool.maturin]
# Publish and the default build. `test-util` stays off here (ADR-SAG-0022).
# Sprint validation passes `--features extension-module,test-util` when pytest
# needs an in-process judge. CLI `--features` replaces this list.
features = ["extension-module"]
module-name = "sc_jev_py"
