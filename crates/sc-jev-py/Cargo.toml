[package]
name = "sc-jev-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PyO3 bindings over sc-jev-check."
readme = "README.md"
# Ships to PyPI as a maturin wheel only (sprint a-9); never to crates.io.
publish = false

[lib]
name = "sc_jev_py"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Maturin enables this so the wheel does not link libpython. `cargo test`
# leaves it off and links the interpreter.
extension-module = ["pyo3/extension-module"]
# Forwards `scripted_answers` to `sc-jev-check`'s test-only registry.
# Production wheels leave this off (ADR-SAG-0022).
test-util = ["sc-jev-check/test-util"]

[dependencies]
pyo3 = { version = "0.26", features = ["abi3-py311"] }
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0" }
sc-jev-check = { path = "../sc-jev-check", version = "0.1.0" }
# Deliberate `=` lockstep with the sc-observability release train; revisited at Phase A review.
sc-observability.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `cargo test` enables this so Rust tests can register scripted judges.
# Maturin and `cargo build` do not. The publish wheel leaves `test-util` off.
sc-jev-check = { path = "../sc-jev-check", version = "0.1.0", features = ["test-util"] }

# Workspace-only Rust/Python canonical-bytes test (REQ-SAG-0102). It lives at
# the repo root and is hosted here because this crate is `publish = false`, so
# the test never lands in (or warns about) a crates.io package.
[[test]]
name = "jev_cross_impl"
path = "../../tests/jev_cross_impl/main.rs"
