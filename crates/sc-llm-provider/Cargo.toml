[package]
name = "sc-llm-provider"
version.workspace = true
description = "Sans-IO LLM provider wire for sc-agent: Anthropic Messages and OpenAI-compatible Chat Completions, JSON-schema output."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sc-agent-http = { path = "../sc-agent-http", version = "0.1.1" }
sc-agent-log = { path = "../sc-agent-log", version = "0.1.1" }
sc-agent-secrets = { path = "../sc-agent-secrets", version = "0.1.1" }
sc-agent-types = { path = "../sc-agent-types", version = "0.1.1" }
serde_json = "1"

[dev-dependencies]
sc-agent-testkit = { path = "../sc-agent-testkit" }
sc-agent-http = { path = "../sc-agent-http", features = ["testing"] }
sc-agent-log = { path = "../sc-agent-log", features = ["testing"] }

[lints]
workspace = true
