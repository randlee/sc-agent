[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "sc-agent-py"
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sc-agent Python API: one function per decidr operation (ANC-006)."
publish = false

[lib]
name = "sc_agent"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
decidr = { workspace = true }
sc-agent-secrets = { workspace = true }
sc-agent-types = { workspace = true }
sc-agent-config = { workspace = true }
sc-agent-log = { workspace = true }
sc-decision-schema = { workspace = true }
sc-observability = "=1.5.0"   # the LogSink trait (PyCallableSink)
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "extension-module"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
sc-agent-secrets = { workspace = true, features = ["test-keyring-guard"] }
tempfile = "3"

[build-dependencies]
# macOS: `-undefined dynamic_lookup` so plain `cargo build`/`cargo test` link the cdylib
# (maturin adds it itself).
pyo3-build-config = "=0.29.2"
