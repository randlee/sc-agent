[package]
name = "sc-agent-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
publish = false

[dependencies]
decidr.workspace = true
sc-agent-config.workspace = true
sc-agent-types.workspace = true
sc-agent-http.workspace = true
sc-agent-log.workspace = true
sc-decision-schema.workspace = true
sc-treesitter = { workspace = true, features = ["python", "grammar-python", "grammar-rust"] }
serde_json = { version = "1", features = ["preserve_order"] }
sc-observability = "=1.5.0"
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[lints]
workspace = true

[lib]
name = "sc_agent"
crate-type = ["cdylib"]
