[package]
name = "sc-agent-py"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sc-agent Python API: one function per decidr operation (ANC-006)."
publish = false

[lib]
name = "sc_agent"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
decidr = { path = "../decidr", version = "0.1.1" }
sc-agent-secrets = { path = "../sc-agent-secrets", version = "0.1.1" }
sc-agent-types = { path = "../sc-agent-types", version = "0.1.1" }
sc-agent-config = { path = "../sc-agent-config", version = "0.1.1" }
sc-agent-log = { path = "../sc-agent-log", version = "0.1.1" }
sc-decision-schema = { path = "../sc-decision-schema", version = "0.1.1" }
sc-observability = "=1.5.0"   # the LogSink trait (PyCallableSink)
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "extension-module"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# macOS: `-undefined dynamic_lookup` so plain `cargo build`/`cargo test` link the cdylib
# (maturin adds it itself).
pyo3-build-config = "=0.29.2"
