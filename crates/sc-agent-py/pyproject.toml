[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sc-decidr"
version = "0.2.9"
description = "The sc-agent Python API: send TypeSafe (Jev) decision requests, list models, run doctor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.maturin]
python-source = "python"
module-name = "sc_agent._native"
