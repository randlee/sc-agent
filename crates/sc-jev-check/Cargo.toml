[package]
name = "sc-jev-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Jev check facade: check.toml, extractors, sessions, and run_check."
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Allowlist. `tests/**` ships so cargo keeps every test target (no publish
# warning); tests that read repo-root fixtures run from the workspace only.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**", "assets/**"]

[features]
default = []
# In-process scripted judges for tests (ADR-SAG-0022). Production builds
# leave this off. `run_check`'s signature does not change (ADR-SAG-0009).
test-util = []

[dependencies]
sc-agent-secrets = { path = "../sc-agent-secrets", version = "0.1.0" }
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0" }
sc-jev = { path = "../sc-jev", version = "0.1.0" }
sc-jev-backends = { path = "../sc-jev-backends", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0", features = ["test-util"] }

[[test]]
name = "a6_exact"
path = "src/run/exact.rs"
