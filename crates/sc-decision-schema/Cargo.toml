[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "sc-decision-schema"
version.workspace = true
description = "Decision-layer contract for sc-agent: TypeSafe System One API types, the Backend and Decision traits, per-question digests."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sc-agent-http = { workspace = true }
sc-agent-types = { workspace = true }
sc-sha = "1.8"
serde = { version = "1", features = ["derive"] }
# preserve_order: nested key order round-trips and digests are stable; float_roundtrip:
# 0.123456789 prints exactly (REQ-SAG-0007).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_path_to_error = "0.1"

[dev-dependencies]
sc-agent-testkit = { workspace = true }

[lints]
workspace = true
