[package]
name = "sc-agent-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared error, judge, and subjects types for sc-agent."
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Allowlist: repo-root fixtures and the cross-impl test stay out of the package.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[lints]
workspace = true

[features]
default = []
# JudgeBackend test double, contract helpers, and the unchecked
# `ResolvedApiKey::new` for test keys. Unit tests compile these via cfg(test);
# downstream crates enable the feature explicitly (dev-dependencies only).
test-util = []

[dependencies]
# Deliberate `=` lockstep with the sc-observability release train; revisited at Phase A review.
sc-observability-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
