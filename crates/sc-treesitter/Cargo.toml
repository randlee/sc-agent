[package]
name = "sc-treesitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tree-sitter producer for sc/subjects/1 documents."

[features]
default = ["python", "rust"]
python = ["dep:tree-sitter-python"]
rust = ["dep:tree-sitter-rust"]

[dependencies]
mimalloc = { version = "=0.1.52" }
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0" }
serde_json.workspace = true
tree-sitter = { version = "=0.27.1" }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }

[[bin]]
name = "sc-treesitter"
path = "src/main.rs"
