[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "sitr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "sitr CLI: run predefined tree-sitter queries (product binary for sc-treesitter)."
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "examples/**"]

[lints]
workspace = true

[dependencies]
sc-treesitter.workspace = true
clap = { version = "4", features = ["derive"] }
sc-observability = "=1.5.0"
sc-agent-log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sitr"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dev-dependencies]
tempfile = "3"
