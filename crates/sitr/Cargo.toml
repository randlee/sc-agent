[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "sitr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "sitr CLI: run predefined tree-sitter queries (product binary for sc-treesitter)."
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "examples/**"]

[lints]
workspace = true

[features]
default = ["grammar-python", "grammar-rust"]
grammar-python = ["sc-treesitter/grammar-python"]
grammar-rust = ["sc-treesitter/grammar-rust"]

[dependencies]
sc-treesitter = { workspace = true, default-features = false }
sc-agent-config = { workspace = true }
sc-agent-log = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sitr"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dev-dependencies]
sc-agent-testkit = { workspace = true }
tempfile = "3"

[[example]]
name = "gen-cli-model"
path = "examples/gen-cli-model.rs"
test = true
