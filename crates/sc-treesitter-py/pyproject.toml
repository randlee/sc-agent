[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "sitr"
version = "0.2.8"
description = "Load tree-sitter grammars and run any query against them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sc-observability==1.5.0"]
license = "MIT"

[tool.maturin]
module-name = "sc_treesitter"
