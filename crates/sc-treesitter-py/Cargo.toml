[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "sc-treesitter-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "sc_treesitter"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
sc-treesitter = { workspace = true, default-features = true, features = ["python"] }
sc-agent-log = { workspace = true, features = ["python"] }
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }

[build-dependencies]
# macOS: `-undefined dynamic_lookup` so plain `cargo build`/`cargo test` link the cdylib
# (maturin adds it itself).
pyo3-build-config = "=0.29.2"
