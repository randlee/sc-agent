[package]
name = "sc-treesitter-py"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
name = "sc_treesitter"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
sc-treesitter = { path = "../sc-treesitter", features = ["python"] }
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "extension-module"] }

[build-dependencies]
# macOS: `-undefined dynamic_lookup` so plain `cargo build`/`cargo test` link the cdylib
# (maturin adds it itself).
pyo3-build-config = "=0.29.2"
