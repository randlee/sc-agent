serde_json = "1"

[dev-dependencies]
sc-observability = "=1.5.0"
sc-agent-testkit = { workspace = true }
sc-agent-http = { workspace = true, features = ["testing"] }
sc-agent-log = { workspace = true, features = ["testing"] }

