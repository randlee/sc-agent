[package]
name = "sc-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "sc-ai CLI for Jev check parity: run, dry-run, and ask."

[dependencies]
mimalloc = "=0.1.52"
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0" }
sc-jev-check = { path = "../sc-jev-check", version = "0.1.0" }
sc-observability = "=1.5.0"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0", features = ["test-util"] }

[[bin]]
name = "sc-ai"
path = "src/main.rs"
