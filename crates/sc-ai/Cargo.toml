[package]
name = "sc-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "sc-ai CLI for Jev check parity: run, dry-run, and ask."
readme = "README.md"
keywords = ["llm", "evaluation", "jev", "cli", "sc-agent"]
categories = ["command-line-utilities"]
# Allowlist. `tests/**` ships so cargo keeps every test target (no publish
# warning); tests that read repo-root fixtures run from the workspace only.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**"]

[lints]
workspace = true

[features]
default = ["cli"]
# Binary-only dependencies (ADR-SAG-0023): the `sc-ai` bin and the `cli` test
# target need them; `--no-default-features` builds the library without them.
cli = ["dep:mimalloc", "dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0" }
sc-jev-check = { path = "../sc-jev-check", version = "0.1.0" }
# Deliberate `=` lockstep (ADR-SAG-0023 list; ADR-SAG-0016).
sc-observability.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0", features = ["test-util"] }
sc-jev-check = { path = "../sc-jev-check", version = "0.1.0", features = ["test-util"] }
tempfile.workspace = true

[[bin]]
name = "sc-ai"
path = "src/main.rs"
required-features = ["cli"]

# Runs the binary through CARGO_BIN_EXE_sc-ai, so it needs the bin's features.
[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]
